name: OMNISCIENCE Scan Engine

on:
  repository_dispatch:
    types:
      - vapt-scan

  workflow_dispatch:
    inputs:
      target:
        description: "Target URL"
        required: true

      chat_id:
        description: "Telegram Chat ID"
        required: true

      callback_url:
        description: "Cloudflare Worker URL"
        required: true

      false_positives:
        description: "False positive patterns"
        required: false
        default: ""

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scan-and-analyze:

    runs-on: ubuntu-latest

    timeout-minutes: 55

    permissions:
      contents: read
      actions: read
      checks: write

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # PYTHON
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install System Packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            dnsutils \
            net-tools \
            whois \
            curl \
            wget \
            jq \
            unzip \
            git

      # =========================================================
      # PYTHON DEPENDENCIES
      # =========================================================

      - name: Install Python Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            requests \
            urllib3 \
            playwright \
            dnspython \
            google-generativeai \
            beautifulsoup4 \
            mmh3 \
            python-whois \
            pyOpenSSL \
            cryptography \
            shodan \
            censys \
            selenium

      # =========================================================
      # PLAYWRIGHT
      # =========================================================

      - name: Install Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      # =========================================================
      # CREATE DIRECTORIES
      # =========================================================

      - name: Create Runtime Directories
        run: |
          mkdir -p cache
          mkdir -p cache/screenshots
          mkdir -p reports
          mkdir -p logs

      # =========================================================
      # RESOLVE INPUTS
      # =========================================================

      - name: Resolve Inputs
        run: |

          echo "EVENT_NAME=${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then

            echo "TARGET=${{ github.event.client_payload.target_url }}" >> $GITHUB_ENV

            echo "CHAT_ID=${{ github.event.client_payload.chat_id }}" >> $GITHUB_ENV

            echo "CLOUDFLARE_WORKER_URL=${{ github.event.client_payload.callback_url }}" >> $GITHUB_ENV

            echo "FALSE_PATTERNS=${{ github.event.client_payload.false_positives }}" >> $GITHUB_ENV

          else

            echo "TARGET=${{ github.event.inputs.target }}" >> $GITHUB_ENV

            echo "CHAT_ID=${{ github.event.inputs.chat_id }}" >> $GITHUB_ENV

            echo "CLOUDFLARE_WORKER_URL=${{ github.event.inputs.callback_url }}" >> $GITHUB_ENV

            echo "FALSE_PATTERNS=${{ github.event.inputs.false_positives }}" >> $GITHUB_ENV

          fi

      # =========================================================
      # SELECT GEMINI KEY
      # =========================================================

      - name: Select Gemini API Key
        run: |

          KEYS=(
            "${{ secrets.GEMINI_API_KEY_1 }}"
            "${{ secrets.GEMINI_API_KEY_2 }}"
            "${{ secrets.GEMINI_API_KEY_3 }}"
            "${{ secrets.GEMINI_API_KEY_4 }}"
            "${{ secrets.GEMINI_API_KEY_5 }}"
            "${{ secrets.GEMINI_API_KEY_6 }}"
          )

          VALID_KEYS=()

          for key in "${KEYS[@]}"; do
            if [ ! -z "$key" ]; then
              VALID_KEYS+=("$key")
            fi
          done

          COUNT=${#VALID_KEYS[@]}

          if [ "$COUNT" -eq 0 ]; then
            echo "No Gemini API keys found"
            exit 1
          fi

          RANDOM_INDEX=$(( RANDOM % COUNT ))

          echo "GEMINI_API_KEY=${VALID_KEYS[$RANDOM_INDEX]}" >> $GITHUB_ENV

      # =========================================================
      # VALIDATE VARIABLES
      # =========================================================

      - name: Validate Runtime Variables
        run: |

          echo "TARGET=$TARGET"
          echo "CHAT_ID=$CHAT_ID"

          if [ -z "$TARGET" ]; then
            echo "TARGET missing"
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "CHAT_ID missing"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_WORKER_URL" ]; then
            echo "CLOUDFLARE_WORKER_URL missing"
            exit 1
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY missing"
            exit 1
          fi

      # =========================================================
      # RUN ENGINE
      # =========================================================

      - name: Run Engine

        env:
          TARGET: ${{ env.TARGET }}

          CHAT_ID: ${{ env.CHAT_ID }}

          CLOUDFLARE_WORKER_URL: ${{ env.CLOUDFLARE_WORKER_URL }}

          FALSE_PATTERNS: ${{ env.FALSE_PATTERNS }}

          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}

          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}

          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}

          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}

          SECURITYTRAILS_API_KEY: ${{ secrets.SECURITYTRAILS_API_KEY }}

          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

          THREADS: "20"

          TIMEOUT: "15"

          RATE_LIMIT_DELAY: "0.5"

          MAX_SCREENSHOTS: "5"

        run: |
          python engine.py

      # =========================================================
      # UPLOAD LOGS / REPORTS
      # =========================================================

      - name: Upload Artifacts
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: omniscience-artifacts

          path: |
            cache
            reports
            logs

          retention-days: 7

      # =========================================================
      # FAILURE DEBUGGING
      # =========================================================

      - name: Workflow Failure Notice
        if: failure()

        run: |
          echo "Workflow failed"
```
